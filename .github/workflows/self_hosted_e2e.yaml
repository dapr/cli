name: E2E - Self-hosted

on:
  push:
    branches:
      - master
      - release-*
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "0 */3 * * *"
    - cron: "0 */6 * * *"
  pull_request:
    branches:
      - master
      - "release-*"
    paths-ignore:
      - "**.md"

jobs:
  self-hosted-e2e:
    name: Run Self-Hosted E2E tests in ${{ matrix.target_os }}_${{ matrix.target_arch }}_${{ matrix.dapr_install_mode }}
    runs-on: ${{ matrix.os }}
    env:
      GOOS: ${{ matrix.target_os }}
      GOARCH: ${{ matrix.target_arch }}
      GOPROXY: https://proxy.golang.org
      ARCHIVE_OUTDIR: dist/archives
      DAPR_RUNTIME_PINNED_VERSION: "1.19.0"
      DAPR_RUNTIME_LATEST_STABLE_VERSION: ""
      GOLANG_PROTOBUF_REGISTRATION_CONFLICT: warn
      PODMAN_VERSION: 5.4.0
    strategy:
      # TODO: Remove this when our E2E tests are stable for podman on MacOS.
      fail-fast: false # Keep running if one leg fails.
      matrix:
        # See https://github.com/actions/runner-images
        os: [macos-14-large, ubuntu-latest, windows-latest]
        target_arch: [amd64]
        dapr_install_mode: [slim, complete]
        include:
          - os: ubuntu-latest
            target_os: linux
          - os: macos-14-large
            target_os: darwin
          - os: windows-latest
            target_os: windows
        exclude:
          - os: windows-latest
            dapr_install_mode: complete
    steps:
      - name: Prepare Go's bin location - MacOS
        if: matrix.os == 'macos-14-large'
        run: |
          export PATH=$HOME/bin:$PATH
          echo "$HOME/bin" >> $GITHUB_PATH

          echo "GOBIN=$HOME/bin" >> $GITHUB_ENV
          mkdir -p $HOME/bin
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        id: setup-go
        with:
          go-version-file: "go.mod"
      - name: Install podman - MacOS
        timeout-minutes: 15
        if: matrix.os == 'macos-14-large' && matrix.dapr_install_mode == 'complete'
        run: |
          # Install podman
          curl -sL -o podman.pkg https://github.com/containers/podman/releases/download/v${{ env.PODMAN_VERSION }}/podman-installer-macos-amd64.pkg
          sudo installer -pkg podman.pkg -target /
          export PATH=/opt/podman/bin:$PATH
          echo "/opt/podman/bin" >> $GITHUB_PATH

          # Start podman machine
          sudo podman-mac-helper install
          podman machine init -v $HOME:$HOME --memory 16384 --cpus 12
          podman machine start --log-level debug
          podman machine ssh sudo sysctl -w kernel.keys.maxkeys=20000
          podman info
          echo "CONTAINER_RUNTIME=podman" >> $GITHUB_ENV
      - name: Determine latest Dapr Runtime version including Pre-releases
        if: github.base_ref == 'master'
        run: |
          export RUNTIME_VERSION=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/dapr/dapr/releases | grep tag_name | awk -F':' '{print $2}' | tr -d '", ' | sed '/-/! s/$/_/' | sort -V | sed 's/_$//' | tr -d 'v' | tail -1)
          if [[ -z "$RUNTIME_VERSION" ]]; then
            echo "Could not fetch the latest Dapr Runtime version. Using pinned version $DAPR_RUNTIME_PINNED_VERSION"
          else
            echo "Found $RUNTIME_VERSION"
            echo "DAPR_RUNTIME_PINNED_VERSION=$RUNTIME_VERSION" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Determine latest stable Dapr Runtime version
        run: |
          # The highest release tag without a pre-release suffix: the version that `dapr init` installs.
          # Not /releases/latest: it skips a release that is still flagged as a pre-release, which happens on GA day.
          # Not the /releases list either: it returns every release body (~17 MB) and intermittently comes back empty.
          LATEST_STABLE_RUNTIME_VERSION=$(git ls-remote --tags --refs https://github.com/dapr/dapr 'v*' | awk -F'refs/tags/v' '{print $2}' | grep -v -- '-' | sort -V | tail -1)
          if [[ -z "$LATEST_STABLE_RUNTIME_VERSION" ]]; then
            echo "Could not determine the latest stable Dapr Runtime version"
            exit 1
          fi
          echo "Found $LATEST_STABLE_RUNTIME_VERSION"
          echo "DAPR_RUNTIME_LATEST_STABLE_VERSION=$LATEST_STABLE_RUNTIME_VERSION" >> $GITHUB_ENV
        shell: bash
      - name: Set the test timeout - MacOS
        if: matrix.os == 'macos-14-large'
        run: echo "E2E_SH_TEST_TIMEOUT=40m" >> $GITHUB_ENV
      - name: Run E2E tests with GHCR
        # runs every 6hrs
        if: github.event.schedule == '0 */6 * * *'
        env:
          DAPR_DEFAULT_IMAGE_REGISTRY: ghcr
          DAPR_E2E_INIT_SLIM: ${{ contains(matrix.os, 'windows-latest') || contains(matrix.dapr_install_mode, 'slim') }}
          CONTAINER_RUNTIME: ${{ env.CONTAINER_RUNTIME }}
          E2E_SH_TEST_TIMEOUT: ${{ env.E2E_SH_TEST_TIMEOUT }}
        run: |
          export TEST_OUTPUT_FILE=$GITHUB_WORKSPACE/test-e2e-standalone.json
          echo "TEST_OUTPUT_FILE=$TEST_OUTPUT_FILE" >> $GITHUB_ENV
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          make e2e-build-run-sh
        shell: bash
      - name: Run E2E tests with Docker hub
        if: github.event.schedule != '0 */6 * * *'
        env:
          DAPR_E2E_INIT_SLIM: ${{ contains(matrix.os, 'windows-latest') || contains(matrix.dapr_install_mode, 'slim') }}
          CONTAINER_RUNTIME: ${{ env.CONTAINER_RUNTIME }}
          E2E_SH_TEST_TIMEOUT: ${{ env.E2E_SH_TEST_TIMEOUT }}
        run: |
          export TEST_OUTPUT_FILE=$GITHUB_WORKSPACE/test-e2e-standalone.json
          echo "TEST_OUTPUT_FILE=$TEST_OUTPUT_FILE" >> $GITHUB_ENV
          export GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          make e2e-build-run-sh
        shell: bash
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target_os }}_${{ matrix.target_arch }}_${{ matrix.dapr_install_mode }}_e2e_standalone.json
          path: ${{ env.TEST_OUTPUT_FILE }}

  # `dapr init` with containers on Windows, against Docker Desktop on the WSL2
  # backend. The Windows leg above only covers slim mode, as the runner image's
  # own Docker engine cannot run Linux containers.
  windows-desktop-init:
    name: Run Windows Docker Desktop init tests
    # windows-2025 ships WSL2, which Docker Desktop's Linux engine runs on.
    runs-on: windows-2025
    timeout-minutes: 45
    # Docker does not support Docker Desktop on Windows Server, which is what
    # the runner is, so this job must not fail the workflow.
    continue-on-error: true
    env:
      GOPROXY: https://proxy.golang.org
      DAPR_RUNTIME_PINNED_VERSION: "1.19.0"
      # Run the test that makes dapr init shut WSL down.
      DAPR_E2E_WSL_SHUTDOWN: "true"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Install Docker Desktop
        timeout-minutes: 25
        run: |
          # The image's own Docker engine only runs Windows containers and owns
          # the default engine pipe.
          Stop-Service docker -Force -ErrorAction SilentlyContinue
          Set-Service docker -StartupType Disabled -ErrorAction SilentlyContinue

          $installer = Join-Path $env:RUNNER_TEMP 'DockerDesktopInstaller.exe'
          curl.exe -fsSL --retry 3 -o $installer 'https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe'
          if ($LASTEXITCODE -ne 0) { throw 'could not download the Docker Desktop installer' }

          # --accept-license accepts the Docker Subscription Service Agreement.
          $install = Start-Process $installer -Wait -PassThru -ArgumentList 'install', '--quiet', '--accept-license', '--backend=wsl-2'
          if ($install.ExitCode -ne 0) { throw "the Docker Desktop installer exited with code $($install.ExitCode)" }

          # Ahead of the image's docker.exe.
          $bin = 'C:\Program Files\Docker\Docker\resources\bin'
          $env:Path = "$bin;$env:Path"
          Add-Content -Path $env:GITHUB_PATH -Value $bin

          Start-Process 'C:\Program Files\Docker\Docker\Docker Desktop.exe'
          $deadline = (Get-Date).AddMinutes(10)
          do {
            Start-Sleep -Seconds 5
            $engine = docker info --format '{{.OSType}}' 2>$null
          } until ($engine -eq 'linux' -or (Get-Date) -gt $deadline)
          if ($engine -ne 'linux') { throw "Docker Desktop's Linux engine did not answer within 10 minutes" }
          docker version
      - name: Build CLI
        run: go build -o dist/windows_amd64/release/dapr.exe .
      - name: Run Windows init tests
        run: go test -tags e2e -count=1 -timeout 30m -v -run '^TestStandaloneInit(AfterUninstallKeepsWSL|WSLHoldsSchedulerPort)$' ./tests/e2e/standalone/...
      - name: Collect Docker Desktop logs
        if: failure()
        run: |
          $ErrorActionPreference = 'Continue'
          docker info
          docker ps --all
          wsl --list --verbose
          netstat -ano | Select-String ':(6060|2379|58081|59091)\s'
          netsh int ipv4 show excludedportrange protocol=tcp
          Copy-Item (Join-Path $env:LOCALAPPDATA 'Docker\log') (Join-Path $env:RUNNER_TEMP 'docker-desktop-logs') -Recurse -ErrorAction SilentlyContinue
          exit 0
      - name: Upload Docker Desktop logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docker-desktop-logs
          path: ${{ runner.temp }}/docker-desktop-logs
          if-no-files-found: ignore
